<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">
<meta property="og:title" content="Yapay Zekâ Çalışanı Kitapçığı | Hala Al-Attiyat">
<meta property="og:description" content="İşletmeniz. Yapay zekâ ile daha güçlü. Türkçe, English, العربية.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B30D12'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Layout idea: the outreach email, opened into a booklet. The email's sky header with its red rule runs across the top, its body is the page, its green WhatsApp button and red-barred signature close it, and its dark green footer ends the last page. Each spread is one asymmetric sheet: a narrow column states the idea with a drawing, a wide column shows it. */
    --red: #B30D12;
    --red-hi: #D0080F;
    --red-lo: #8E0107;
    --blue: #2F6FA8;
    --blue-ink: #245A8C;
    --sky: #9CC3EA;
    --sky-1: #DCE8F6;
    --sky-2: #F4F8FD;
    --ink: #14213A;
    --muted: #41506B;
    --green: #5B8F2E;
    --green-ink: #3F6B1F;
    --green-hi: #A5D46F;
    --green-1: #1F3322;
    --green-2: #5B6A49;
    --wa: #388E3C;
    --wa-lo: #1F5F27;
    --navy: #0F1C2D;
    --display: 'Jost', 'Poppins', 'Century Gothic', 'Avenir Next', 'Segoe UI', sans-serif;
    --body: 'Hanken Grotesk', 'Helvetica Neue', 'Liberation Sans', Arial, sans-serif;
    --lh: 1.6;
    --lh-h: 1.14;
    --lh-s: 1.35;
    --track: -.012em;
    --caps: .04em;
    --dirx: 1;
    color-scheme: light;
  }
  :root[lang="ar"] {
    --display: 'Alexandria', 'Tajawal', 'Segoe UI', 'Geeza Pro', 'Noto Sans Arabic', Tahoma, sans-serif;
    --body: 'IBM Plex Sans Arabic', 'Segoe UI', 'Geeza Pro', 'Noto Sans Arabic', Tahoma, sans-serif;
    --lh: 1.85;
    --lh-h: 1.45;
    --lh-s: 1.6;
    --track: 0;
    --caps: 0;
  }
  :root[dir="rtl"] { --dirx: -1; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sky-1); color: var(--ink); font: 400 17px/var(--lh) var(--body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  h1, h2, h3, h4, p, ul, ol, dl, dd, figure, blockquote { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  button { font: inherit; }
  img, svg { display: block; max-width: 100%; }
  img { height: auto; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  [dir="rtl"] .dir { transform: scaleX(-1); }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* Shell: the email's header on top, one page at a time, the reader's bar below */
  .app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  .top, .bot { position: relative; z-index: 30; color: var(--ink); }
  .top { display: flex; align-items: center; gap: 10px; min-height: 66px; padding: 8px 20px; background: linear-gradient(180deg, #D4E3F4 0%, var(--sky-2) 100%); border-bottom: 2px solid var(--red); }
  .brand { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
  .brand img { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--red); }
  .brand-t { display: grid; min-width: 0; }
  .brand b { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 600 18px/1.3 var(--display); letter-spacing: var(--caps); color: var(--red); }
  .brand-t span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; line-height: 1.4; color: var(--blue-ink); }
  .chip { display: inline-flex; align-items: center; gap: 8px; flex: none; height: 38px; padding: 0 12px; border: 1px solid var(--sky); border-radius: 999px; background: #FFFFFF; color: var(--ink); font: 500 14px/1 var(--body); white-space: nowrap; cursor: pointer; }
  .chip .ic { width: 18px; height: 18px; color: var(--red); }
  .chip .caret { width: 14px; height: 14px; color: var(--muted); }
  .langs { display: inline-flex; flex: none; padding: 3px; border: 1px solid var(--sky); border-radius: 999px; background: #FFFFFF; }
  .langs button { min-width: 40px; height: 32px; padding: 0 9px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: 600 13px/1 var(--body); cursor: pointer; }
  .langs button[lang="ar"] { font: 500 14px/1 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; }
  .langs button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }

  .stage { position: relative; overflow: hidden; background: var(--sky-2); }
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
    --fg: var(--ink); --soft: var(--muted); --rule: rgba(47, 111, 168, .26); --accent: var(--blue-ink); --card: #FFFFFF; --good: var(--green-ink); --good-fill: var(--green);
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 42%, #FFFFFF 100%); color: var(--fg); }
  .page.dark { --fg: #F4F8FD; --soft: #C3CEDD; --rule: rgba(220, 232, 246, .28); --accent: var(--sky); --card: rgba(255, 255, 255, .07); --good: var(--green-hi); --good-fill: var(--green-hi); }
  .page.navy { background: var(--navy); }
  .page.green { --soft: #E3EBDD; --accent: #DDE8D8; --rule: rgba(221, 232, 216, .34); background: linear-gradient(135deg, var(--green-1) 0%, var(--green-2) 100%); }

  .sheet { position: relative; flex: 1 0 auto; width: 100%; max-width: 1160px; margin: 0 auto; padding: clamp(26px, 4.4vw, 56px) clamp(20px, 4vw, 48px) 104px; display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(26px, 4vw, 60px); align-content: start; }
  .lede { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .body { display: grid; gap: 26px; align-content: start; min-width: 0; }
  @media (min-width: 920px) {
    .sheet { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
    .lede { position: sticky; top: clamp(26px, 4.4vw, 56px); }
    .lede.tall { position: static; }
  }
  @keyframes fwd { from { opacity: 0; transform: translateX(calc(22px * var(--dirx))); } to { opacity: 1; transform: none; } }
  @keyframes back { from { opacity: 0; transform: translateX(calc(-22px * var(--dirx))); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .in-fwd .sheet { animation: fwd .32s ease both; }
  .in-back .sheet { animation: back .32s ease both; }

  /* Type */
  h1 { font: 300 clamp(34px, 4.5vw, 56px)/var(--lh-h) var(--display); letter-spacing: var(--track); text-wrap: balance; }
  h1 span { display: block; }
  h2 { font: 400 clamp(27px, 3.3vw, 40px)/var(--lh-h) var(--display); letter-spacing: var(--track); text-wrap: balance; }
  h3 { font: 500 21px/var(--lh-s) var(--display); text-wrap: balance; }
  :root[lang="ar"] h1 { font-size: clamp(30px, 3.9vw, 48px); font-weight: 400; }
  :root[lang="ar"] h2 { font-size: clamp(23px, 2.7vw, 33px); }
  :root[lang="ar"] h3 { font-size: 19px; }
  h4 { font: 500 18px/var(--lh-s) var(--display); text-wrap: balance; }
  :root[lang="ar"] h4 { font-size: 16.5px; }
  p { text-wrap: pretty; }
  .folio { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 14px; line-height: 1.5; color: var(--soft); }
  .folio-n { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; unicode-bidi: isolate; }
  .intro { font-size: 18px; color: var(--soft); max-width: 34em; }
  .aside { padding: 14px 0 0; border-top: 1px solid var(--accent); font-size: 16px; line-height: var(--lh); max-width: 34em; }
  .note { font-size: 15px; line-height: var(--lh); color: var(--soft); max-width: 40em; }
  .link-btn { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; border: 0; background: none; color: var(--blue-ink); font: 500 15.5px/var(--lh-s) var(--body); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
  .link-btn .ic { width: 16px; height: 16px; }
  .onward { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 6px; padding: 15px 18px; border: 1px solid var(--rule); border-radius: 16px; background: var(--card); color: inherit; text-align: start; cursor: pointer; transition: border-color .2s; }
  .onward:hover { border-color: var(--red-hi); }
  .onward span { display: grid; gap: 1px; min-width: 0; }
  .onward small { font-size: 13px; line-height: var(--lh-s); color: var(--soft); }
  .onward b { font: 500 18px/var(--lh-s) var(--display); }
  .onward .ic { margin-inline-start: auto; padding: 9px; width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--red-hi), var(--red-lo)); color: #FFFFFF; stroke-width: 2; }

  /* Buttons, in the email's colours: green for WhatsApp, outlined for the rest */
  .btns { display: grid; gap: 10px; }
  @media (min-width: 620px) { .btns { grid-template-columns: repeat(2, minmax(0, 1fr)); } .btn.wa { grid-column: 1 / -1; } }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 12px 18px; border: 1px solid var(--sky); border-radius: 12px; background: #FFFFFF; color: var(--blue-ink); font: 600 16px/var(--lh-s) var(--body); text-align: center; text-decoration: none; cursor: pointer; transition: border-color .2s, background-color .2s; }
  .btn:hover { border-color: var(--blue); background: var(--sky-2); }
  .btn.wa { min-height: 60px; border: 0; background: linear-gradient(135deg, var(--wa) 0%, var(--wa-lo) 100%); color: #FFFFFF; font-size: 17px; box-shadow: 0 10px 22px rgba(31, 95, 39, .32); }
  .btn.wa:hover { background: linear-gradient(135deg, #3F9A44 0%, #256B2D 100%); }
  .btn .ic { width: 20px; height: 20px; }

  /* Cover */
  .cover { align-content: center; row-gap: 22px; }
  .poster { position: relative; order: 3; container-type: inline-size; overflow: hidden; border-radius: 22px; background: var(--sky-1); box-shadow: 0 22px 46px -20px rgba(20, 33, 58, .5); }
  .poster img { width: 100%; }
  .banner { position: absolute; inset-inline: 5.5%; top: 3.6%; padding: 2.6% 3% 2.2%; border-radius: 22px; background: linear-gradient(135deg, #E0080F 0%, var(--red-lo) 100%); box-shadow: 0 12px 26px rgba(90, 0, 4, .34), inset 0 1px 0 rgba(255, 255, 255, .35); color: #FFFFFF; text-align: center; font-family: var(--display); font-weight: 600; }
  .b-line { display: flex; align-items: center; justify-content: center; gap: .32em; font-size: 30px; font-size: 7.6cqw; line-height: 1.32; }
  .b-tile { padding: 0 .36em; border-radius: .32em; background: #FFFFFF; color: var(--red); }
  .b-sub { font-size: 24px; font-size: 6.1cqw; line-height: 1.32; }
  :root[lang="ar"] .b-line { font-size: 24px; font-size: 6.2cqw; line-height: 1.6; }
  :root[lang="ar"] .b-sub { font-size: 22px; font-size: 5.6cqw; line-height: 1.5; }
  .b-swoosh { width: 32%; margin: 0 auto; }
  .b-swoosh path { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; }
  .cover-main { order: 1; }
  .medal { float: inline-end; width: 84px; height: 84px; margin-inline-start: 14px; border-radius: 50%; box-shadow: 0 0 0 3px #FFFFFF, 0 10px 22px rgba(20, 33, 58, .32); }
  .cover-sub { margin-top: 14px; font: 400 clamp(18px, 1.9vw, 22px)/var(--lh-s) var(--display); color: var(--red); max-width: 26em; }
  .chooser { order: 2; display: grid; gap: 10px; align-content: start; }
  .chooser-title { font: 500 20px/var(--lh-s) var(--display); letter-spacing: 0; }
  :root[lang="ar"] .chooser-title { font-size: 18px; }
  .chooser-hint { margin-top: -8px; font-size: 14.5px; line-height: var(--lh-s); color: var(--soft); }
  .cover-foot { order: 4; display: grid; gap: 14px; align-content: start; }
  .cover-lead { padding-inline-start: 14px; border-inline-start: 3px solid var(--red); font-size: 16px; color: var(--soft); max-width: 30em; }
  .sig { display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; color: inherit; text-align: start; cursor: pointer; }
  .sig img { flex: none; width: 62px; height: 62px; border-radius: 50%; border: 2px solid var(--red); }
  .sig b { display: block; font: 600 18px/var(--lh-s) var(--display); letter-spacing: var(--caps); color: var(--red); }
  .sig-r { display: block; font-size: 13.5px; line-height: var(--lh-s); color: var(--blue-ink); }
  .sig-go { display: inline-flex; align-items: center; gap: 3px; font-size: 14px; line-height: var(--lh-s); color: var(--blue-ink); text-decoration: underline; text-underline-offset: 3px; }
  .sig-go .ic { width: 14px; height: 14px; }
  @media (min-width: 920px) {
    .cover { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); grid-template-areas: "poster main" "poster chooser" "foot chooser"; grid-template-rows: auto auto 1fr; padding-top: clamp(22px, 2.6vw, 34px); padding-bottom: 96px; row-gap: 16px; }
    .poster { grid-area: poster; align-self: start; }
    .cover-main { grid-area: main; }
    .chooser { grid-area: chooser; }
    .cover-foot { grid-area: foot; }
    .medal { display: none; }
    .cover h1 { font-size: clamp(34px, 3.5vw, 44px); }
    :root[lang="ar"] .cover h1 { font-size: clamp(28px, 3.1vw, 40px); }
    .cover-sub { margin-top: 8px; font-size: clamp(17px, 1.55vw, 20px); }
    .cover .door { padding: 8px 14px; }
    .cover .mark { width: 44px; height: 44px; }
  }
  .doors { display: grid; gap: 9px; }
  .door { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; width: 100%; padding: 11px 14px; border: 1px solid var(--rule); border-radius: 16px; background: var(--card); color: inherit; text-align: start; cursor: pointer; box-shadow: 0 6px 14px rgba(47, 111, 168, .09); transition: border-color .2s, transform .2s; }
  .door:hover { border-color: var(--red); transform: translateX(calc(4px * var(--dirx))); }
  .door[aria-pressed="true"] { border-color: var(--red); box-shadow: 0 0 0 2px rgba(179, 13, 18, .18); }
  .mark { display: grid; place-items: center; flex: none; width: 48px; height: 48px; border-radius: 14px; color: #FFFFFF; }
  .t-red { background: linear-gradient(135deg, var(--red-hi), var(--red-lo)); }
  .t-blue { background: linear-gradient(135deg, #3F86C6, #235A8D); }
  .t-green { background: linear-gradient(135deg, var(--green), var(--green-ink)); }
  .t-ink { background: linear-gradient(135deg, #2A3B5C, var(--ink)); }
  .door-txt { display: grid; gap: 1px; min-width: 0; }
  .door b { font: 500 18.5px/var(--lh-s) var(--display); }
  :root[lang="ar"] .door b { font-size: 17px; }
  .door .who { font-size: 13.5px; line-height: var(--lh-s); color: var(--soft); }
  .door .hook { font-size: 15px; line-height: var(--lh-s); }
  .door-go { width: 18px; height: 18px; color: var(--red); }

  /* Sector story */
  .story { display: grid; gap: 12px; font-size: 17.5px; max-width: 34em; }
  .chat-fig { display: grid; gap: 10px; }
  .chat { display: grid; gap: 10px; padding: 18px; border-radius: 18px; background: var(--navy); color: #F4F8FD; box-shadow: 0 26px 50px -30px rgba(15, 28, 45, .8); }
  .chat-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid rgba(156, 195, 234, .24); font: 500 15.5px/var(--lh-s) var(--display); }
  .ava { flex: none; width: 32px; height: 32px; border-radius: 50%; }
  .chat-head time { margin-inline-start: auto; font: 400 13.5px/1 var(--body); color: #B4C3D9; font-variant-numeric: tabular-nums; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; font-size: 15.5px; line-height: 1.5; }
  :root[lang="ar"] .msg { line-height: 1.7; }
  :root[lang="ar"] .msg[lang="en"] { line-height: 1.5; }
  .msg.c { justify-self: end; border: 1px solid rgba(156, 195, 234, .3); border-end-end-radius: 4px; background: #1A2C47; }
  .msg.a { justify-self: start; border-end-start-radius: 4px; background: #FFFFFF; color: var(--ink); }
  .record { margin-top: 6px; padding: 13px 15px; border: 1px solid var(--green-hi); border-radius: 12px; }
  .record-t { display: flex; align-items: center; gap: 8px; padding-bottom: 9px; font: 500 14.5px/var(--lh-s) var(--display); color: var(--green-hi); }
  .record-t .ic { width: 17px; height: 17px; }
  .record dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 16px; }
  .record dt { font-size: 12.5px; line-height: var(--lh-s); color: #B4C3D9; }
  .record dd { font-size: 14.5px; line-height: var(--lh-s); }
  .chat.play .msg, .chat.play .record { animation: rise .45s ease both; animation-delay: calc(var(--i) * .36s + .25s); }
  figcaption { font-size: 13.5px; line-height: var(--lh-s); color: var(--soft); }
  .caps { display: grid; gap: 4px; }
  .caps h3 { padding-bottom: 10px; }

  /* Expandable rows, used for capabilities, the five traits and the questions */
  .acc { border-top: 1px solid var(--rule); }
  .acc:last-of-type { border-bottom: 1px solid var(--rule); }
  .acc summary { display: flex; align-items: center; gap: 14px; padding: 15px 0; list-style: none; cursor: pointer; font: 500 19px/var(--lh-s) var(--display); }
  :root[lang="ar"] .acc summary { font-size: 17.5px; }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary small { display: block; padding-top: 3px; font: 400 15px/var(--lh-s) var(--body); color: var(--soft); }
  .acc .count { margin-inline-start: auto; font: 400 13.5px/1 var(--body); color: var(--soft); font-variant-numeric: tabular-nums; }
  .pm { position: relative; flex: none; width: 28px; height: 28px; margin-inline-start: auto; border: 1px solid var(--rule); border-radius: 50%; color: var(--red); }
  .dark .pm { color: var(--accent); }
  .count + .pm { margin-inline-start: 0; }
  .pm::before, .pm::after { content: ""; position: absolute; left: 50%; top: 50%; width: 11px; height: 1.5px; background: currentColor; transform: translate(-50%, -50%); }
  .pm::after { transform: translate(-50%, -50%) rotate(90deg); transition: transform .2s; }
  .acc[open] .pm::after { transform: translate(-50%, -50%); }
  .acc-body { padding: 0 0 18px; padding-inline-end: 42px; font-size: 16.5px; max-width: 40em; }
  .reply { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: end; padding: 0 0 18px; }
  .reply img { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--red); }
  .reply p { justify-self: start; padding: 11px 16px; border: 1px solid var(--sky); border-radius: 16px; border-end-start-radius: 4px; background: #FFFFFF; font-size: 16px; max-width: 40em; }
  .checks { display: grid; gap: 10px; padding: 0 0 18px; }
  .checks li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; font-size: 16.5px; line-height: 1.5; }
  :root[lang="ar"] .checks li { line-height: 1.7; }
  .checks .ic { width: 18px; height: 18px; margin-top: 4px; color: var(--good-fill); stroke-width: 2.2; }
  :root[lang="ar"] .checks .ic { margin-top: 6px; }
  @media (min-width: 620px) { .checks.two { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; } }

  /* Drawings carried over from the first booklet */
  .desk { display: grid; gap: 8px; max-width: 460px; }
  .bubs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 4px 0 2px; }
  .bub { padding: 7px 14px; border: 1.5px solid var(--sky); border-radius: 14px; background: #FFFFFF; color: var(--ink); font: 600 14.5px/1.45 var(--body); box-shadow: 0 5px 12px rgba(47, 111, 168, .12); transform: rotate(-2deg); }
  .bub:nth-child(even) { transform: rotate(2.5deg); }
  .bub.hot { border-color: var(--red); }
  .desk svg { width: 100%; height: auto; }
  .desk-cap { font: 500 20px/var(--lh-s) var(--display); color: var(--red); text-align: center; }
  .flow { max-width: 460px; padding: 14px 18px 8px; overflow: hidden; border-radius: 20px; background: var(--navy); }
  .flow-l { display: flex; justify-content: space-between; font: 500 16px/var(--lh-s) var(--display); }
  .fl-a { color: #FF8A8F; }
  .fl-b { color: var(--sky); }
  .flow svg { width: 100%; height: auto; }
  .orbit { position: relative; width: min(100%, 400px); padding: 18px 0 0; }
  .orbit img { width: 60%; margin: 0 auto; }
  .orb-chip { position: absolute; padding: 6px 14px; border-radius: 999px; background: #FFFFFF; color: var(--blue-ink); font: 600 14.5px/1.5 var(--body); box-shadow: 0 6px 14px rgba(0, 0, 0, .3); }
  .o1 { inset-inline-start: 0; top: 20%; }
  .o2 { inset-inline-end: 0; top: 20%; }
  .o3 { inset-inline-start: 0; bottom: 18%; }
  .o4 { inset-inline-end: 0; bottom: 18%; }
  .keep { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: min(100%, 400px); }
  .keep div { display: grid; place-items: center; padding: 11px 6px; border-radius: 14px; background: linear-gradient(135deg, var(--green), var(--green-ink)); color: #FFFFFF; text-align: center; font: 600 14.5px/var(--lh-s) var(--display); }
  .road { max-width: 400px; overflow: hidden; border-radius: 22px; box-shadow: 0 22px 46px -24px rgba(20, 33, 58, .5); }
  .road svg { width: 100%; height: auto; }
  .road text { font: 700 17px Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }

  .org { max-width: 520px; padding: 6px 4px 0; border-radius: 20px; background: linear-gradient(180deg, var(--sky-1) 0%, #FFFFFF 100%); border: 1px solid var(--sky-1); }
  .org svg { width: 100%; height: auto; }
  .org text { font-family: var(--display); text-anchor: middle; }
  .org .o-you { font-size: 25px; font-weight: 600; fill: #FFFFFF; }
  .org .o-dept { font-size: 16px; font-weight: 500; fill: var(--ink); }
  .org .o-x { font-size: 15.5px; font-weight: 500; fill: #6B7487; }
  .org .o-name { font-size: 17px; font-weight: 600; fill: var(--red); }
  .org .o-line { font-size: 22px; font-weight: 500; fill: var(--red); }
  :root[lang="ar"] .org .o-you { font-size: 21px; }
  :root[lang="ar"] .org .o-dept, :root[lang="ar"] .org .o-x { font-size: 15px; }
  .coffee { display: grid; gap: 12px; padding: 18px; border: 1px solid var(--sky); border-radius: 20px; background: #FFFFFF; box-shadow: 0 10px 24px rgba(47, 111, 168, .1); }
  .coffee h3 { color: var(--ink); }
  .coffee svg { width: 100%; max-width: 420px; height: auto; margin: 0 auto; }
  .coffee svg text { font-family: var(--display); text-anchor: middle; fill: #FFFFFF; }
  .pills { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; }
  .pills li { display: grid; place-items: center; min-height: 62px; padding: 6px 8px; border-radius: 14px; background: var(--sky-1); text-align: center; font: 500 15px/var(--lh-s) var(--display); }
  .nos { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; font-weight: 600; font-size: 15.5px; color: var(--green-ink); }
  .nos li { display: inline-flex; align-items: center; gap: 6px; }
  .nos .ic { width: 18px; height: 18px; stroke-width: 2.2; }
  .bring { text-align: center; font: 500 18px/var(--lh-s) var(--display); color: var(--red); text-wrap: balance; }

  /* Floating WhatsApp button, on every page */
  .fab { position: absolute; z-index: 25; bottom: 18px; inset-inline-start: 18px; display: inline-flex; align-items: center; gap: 9px; height: 54px; padding: 0 20px 0 16px; border-radius: 999px; background: linear-gradient(135deg, var(--wa) 0%, var(--wa-lo) 100%); color: #FFFFFF; font: 600 16px/1 var(--body); text-decoration: none; box-shadow: 0 0 0 3px rgba(255, 255, 255, .92), 0 14px 30px rgba(31, 95, 39, .45); }
  :root[lang="ar"] .fab { font-size: 16.5px; }
  .fab .ic { width: 23px; height: 23px; stroke-width: 2; }
  .fab::before { content: ""; position: absolute; inset: 0; border-radius: inherit; animation: ping 2.4s ease-out 1.2s 3; }
  .fab:hover { filter: brightness(1.07); }
  .fab[hidden] { display: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(56, 142, 60, .55); } 80%, 100% { box-shadow: 0 0 0 18px rgba(56, 142, 60, 0); } }

  /* Sector page: badges, the live demo with its timeline, and the options */
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badges li { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px 6px 11px; border: 1px solid var(--rule); border-radius: 999px; background: var(--card); font: 500 14px/1.35 var(--body); box-shadow: 0 4px 10px rgba(47, 111, 168, .07); }
  .badges .ic { width: 17px; height: 17px; color: var(--red); }
  .demo, .opts, .traits, .lasting { display: grid; gap: 12px; }
  .asks { display: flex; flex-wrap: wrap; gap: 8px; }
  .ask { padding: 9px 15px; border: 1.5px solid var(--sky); border-radius: 18px; border-end-end-radius: 5px; background: #FFFFFF; color: var(--ink); font: 500 14.5px/1.45 var(--body); text-align: start; cursor: pointer; transition: border-color .2s, background-color .2s; }
  .ask:hover { border-color: var(--blue); }
  .ask[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #FFFFFF; }
  .chat-head > span { display: grid; }
  .chat-head small { font: 400 12.5px/1.3 var(--body); color: var(--green-hi); }
  .tl { justify-self: start; width: 92%; padding: 14px 16px; border-radius: 14px; border-end-start-radius: 4px; background: #FFFFFF; color: var(--ink); }
  .tl-t { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--sky-1); font: 500 14.5px/1.3 var(--display); color: var(--blue-ink); }
  .tl-t .ic { width: 17px; height: 17px; }
  .tl li { position: relative; display: grid; gap: 1px; padding: 0 0 12px; padding-inline-start: 24px; font-size: 14.5px; line-height: 1.45; }
  :root[lang="ar"] .tl li { line-height: 1.6; }
  .tl li::before { content: ""; position: absolute; inset-inline-start: 3px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px rgba(47, 111, 168, .15); }
  .tl li::after { content: ""; position: absolute; inset-inline-start: 8px; top: 19px; bottom: 2px; width: 1.5px; background: var(--sky); }
  .tl li:last-child { padding-bottom: 0; }
  .tl li:last-child::before { background: var(--green); box-shadow: 0 0 0 3px rgba(91, 143, 46, .18); }
  .tl li:last-child::after { display: none; }
  .tl b { font-size: 13px; font-weight: 600; color: var(--blue-ink); font-variant-numeric: tabular-nums; }
  .sent { display: inline-flex; align-items: center; gap: 7px; justify-self: center; padding: 5px 13px; border-radius: 999px; background: rgba(165, 212, 111, .14); color: var(--green-hi); font-size: 13.5px; line-height: 1.4; }
  .sent .ic { width: 15px; height: 15px; stroke-width: 2.4; }
  .chat.play .msg, .chat.play .tl, .chat.play .tl li, .chat.play .sent { animation: rise .45s ease both; animation-delay: var(--d, 0s); }
  .opt-list { display: grid; gap: 12px; }
  .opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; padding: 18px; border: 1px solid var(--rule); border-radius: 18px; background: var(--card); box-shadow: 0 8px 20px rgba(47, 111, 168, .08); }
  .opt .mark { width: 52px; height: 52px; border-radius: 15px; }
  .for { display: inline-block; margin-bottom: 5px; padding: 1px 10px; border-radius: 999px; font-size: 12.5px; line-height: 1.7; font-weight: 600; }
  .for-c { background: rgba(179, 13, 18, .08); color: var(--red); }
  .for-t { background: rgba(47, 111, 168, .1); color: var(--blue-ink); }
  .for-b { background: rgba(91, 143, 46, .12); color: var(--green-ink); }
  .opt-d { padding-top: 4px; font-size: 15.5px; color: var(--soft); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; }
  .tags li { padding: 3px 11px; border: 1px solid var(--rule); border-radius: 999px; background: rgba(156, 195, 234, .12); font-size: 13px; line-height: 1.55; }

  /* Without it, with it: one message, two outcomes, then the pairs */
  .lanes { display: grid; gap: 16px; padding: 18px; border: 1px solid var(--rule); border-radius: 18px; background: var(--card); box-shadow: 0 8px 20px rgba(47, 111, 168, .08); }
  .lanes-t { display: flex; align-items: center; gap: 8px; font: 500 16px/1.35 var(--display); color: var(--ink); }
  .lanes-t .ic { width: 18px; height: 18px; color: var(--red); }
  .lane { display: grid; gap: 10px; }
  .lane-l { justify-self: start; padding: 1px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 1.7; }
  .lane.bad .lane-l { background: rgba(179, 13, 18, .08); color: var(--red); }
  .lane.good .lane-l { background: rgba(91, 143, 46, .12); color: var(--green-ink); }
  .lane ol { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lane li { position: relative; display: grid; gap: 2px; align-content: start; padding-top: 26px; padding-inline-end: 8px; font-size: 13.5px; line-height: 1.35; }
  :root[lang="ar"] .lane li { line-height: 1.55; }
  .lane li::after { content: ""; position: absolute; top: 8px; inset-inline-start: 8px; inset-inline-end: -8px; height: 2px; background: var(--sky); }
  .lane li.end::after { display: none; }
  .lane li i { position: absolute; z-index: 1; top: 1px; inset-inline-start: 1px; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--blue); color: #FFFFFF; }
  .lane.bad li i { background: #9AA6B8; }
  .lane li.end i { top: -3px; inset-inline-start: -2px; width: 23px; height: 23px; }
  .lane.bad li.end i { background: var(--red); }
  .lane.good li.end i { background: var(--green); }
  .lane li i .ic { width: 13px; height: 13px; stroke-width: 3; }
  .lane b { font-weight: 600; color: var(--blue-ink); font-variant-numeric: tabular-nums; }
  .lane.bad b, .lane.bad span { color: var(--soft); }
  .lane.good li.end span { font-weight: 600; color: var(--green-ink); }
  .lane.bad li.end span { font-weight: 600; color: var(--red); }
  .pairs { display: grid; }
  .pairs-h, .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; }
  .pairs-h { padding-bottom: 10px; font: 500 15px/1.3 var(--display); color: var(--soft); }
  .pairs-h span:last-child { color: var(--good); }
  .pair { padding: 12px 0; border-top: 1px solid var(--rule); }
  .pair:last-child { border-bottom: 1px solid var(--rule); }
  .pair p { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: start; font-size: 15.5px; line-height: 1.45; }
  .was { color: var(--soft); }
  .now { font-weight: 500; }
  .pair .ic { width: 17px; height: 17px; margin-top: 2px; stroke-width: 2.4; }
  :root[lang="ar"] .pair .ic { margin-top: 5px; }
  .was .ic { color: var(--red); }
  .now .ic { color: var(--good-fill); }

  /* How it works, and icon tiles */
  .how { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.15fr) auto minmax(0, 1fr); align-items: center; gap: 10px; }
  .how-col { display: grid; gap: 8px; }
  .how-t { font-size: 13px; line-height: 1.4; color: var(--soft); }
  .how-col ul { display: grid; gap: 7px; }
  .how-col li { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); font-size: 14px; line-height: 1.3; }
  .how-col .ic { width: 17px; height: 17px; color: var(--accent); }
  .how-col.out li { border-color: rgba(165, 212, 111, .5); }
  .how-col.out .ic { color: var(--good-fill); }
  .how-arrow .ic { width: 22px; height: 22px; color: var(--red-hi); }
  .how-core { display: grid; justify-items: center; gap: 8px; padding: 16px 12px; border: 1px solid var(--sky); border-radius: 18px; background: rgba(156, 195, 234, .08); text-align: center; }
  .how-core img { width: 92px; height: 92px; border-radius: 50%; }
  .how-core b { font: 500 16.5px/1.3 var(--display); }
  .how-core ul { display: grid; gap: 5px; width: 100%; }
  .how-core li { padding: 4px 8px; border-radius: 999px; background: rgba(156, 195, 234, .16); font-size: 12.5px; line-height: 1.45; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .tiles.three { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .tile { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; padding: 16px; border: 1px solid var(--rule); border-radius: 16px; background: var(--card); }
  .tile.v { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .tile .mark { width: 44px; height: 44px; border-radius: 13px; }
  .tile .mark .ic { width: 21px; height: 21px; }
  .tile p { padding-top: 3px; font-size: 14.5px; line-height: 1.5; color: var(--soft); }
  :root[lang="ar"] .tile p { line-height: 1.7; }
  .phase-h { display: flex; align-items: center; justify-content: space-between; }
  .phase-h .ic { width: 26px; height: 26px; color: var(--accent); }
  .ext { display: flex; flex-wrap: wrap; gap: 8px; }
  .ext li { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 999px; font-size: 14px; line-height: 1.4; }
  .ext .ic { width: 17px; height: 17px; color: var(--accent); }

  /* AI employee */
  .layers { display: grid; gap: 8px; }
  .layer { display: grid; gap: 2px; padding: 13px 16px; border: 1px solid var(--rule); border-radius: 12px; }
  .layer b { font: 500 17px/var(--lh-s) var(--display); }
  .layer span { font-size: 14px; line-height: var(--lh-s); color: var(--soft); }
  .layer.mid { border-color: var(--sky); background: rgba(156, 195, 234, .14); box-shadow: inset 4px 0 0 var(--red-hi); }
  [dir="rtl"] .layer.mid { box-shadow: inset -4px 0 0 var(--red-hi); }
  .stack { display: grid; gap: 10px; }
  .cap { font-size: 13.5px; line-height: var(--lh-s); color: var(--soft); max-width: 40em; }

  /* Operating models */
  .seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--rule); border-radius: 14px; background: var(--card); }
  .seg button { flex: 1 1 auto; min-height: 44px; padding: 8px 14px; border: 0; border-radius: 10px; background: transparent; color: var(--soft); font: 500 15.5px/1.3 var(--body); cursor: pointer; }
  .seg button[aria-selected="true"] { background: var(--ink); color: #FFFFFF; }
  .model { display: grid; gap: 22px; }
  .duo { display: flex; align-items: flex-start; justify-content: center; padding: 22px 8px 4px; }
  .node { display: grid; justify-items: center; gap: 8px; width: 108px; font-size: 13.5px; line-height: var(--lh-s); text-align: center; transition: opacity .25s; }
  .node i { display: grid; place-items: center; width: 62px; height: 62px; overflow: hidden; border: 1px solid var(--blue); border-radius: 50%; background: var(--card); color: var(--blue); }
  .node.core i { border: 0; box-shadow: 0 8px 18px rgba(15, 28, 45, .3); }
  .wire { flex: 1 1 24px; max-width: 150px; height: 2px; margin-top: 30px; border-radius: 2px; background: var(--red); transition: opacity .25s; }
  .m-internal .cust, .m-internal .w-cust, .m-customer .team, .m-customer .w-team { opacity: .25; }
  .pos { font: 400 clamp(22px, 2.4vw, 28px)/var(--lh-s) var(--display); text-wrap: balance; }
  :root[lang="ar"] .pos { font-size: clamp(20px, 2vw, 24px); }
  .model-text { font-size: 16.5px; max-width: 40em; }
  .in-sector { display: grid; gap: 6px; padding: 16px 18px; border: 1px solid var(--good-fill); border-radius: 14px; background: var(--card); }
  .in-sector-t { display: flex; align-items: center; gap: 8px; font: 500 15px/var(--lh-s) var(--display); color: var(--good); }
  .in-sector-t .ic { width: 18px; height: 18px; }
  .in-sector p:last-child { font-size: 16.5px; }

  /* Impact */

  /* Investment */
  .cost { display: grid; gap: 12px; }
  .cost-bars { display: flex; align-items: flex-end; gap: 6px; height: 96px; padding-bottom: 10px; border-bottom: 1px dashed var(--accent); }
  .cost-bars .once { flex: 0 0 26%; height: 100%; border-radius: 6px 6px 0 0; background: linear-gradient(135deg, var(--red-hi), var(--red-lo)); }
  .cost-bars .mo { flex: 1 1 0; height: 14px; border-radius: 3px 3px 0 0; background: var(--green-hi); }
  .cost-leg { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13.5px; line-height: var(--lh-s); color: var(--soft); }
  .cost-leg span { display: inline-flex; align-items: center; gap: 7px; }
  .cost-leg i { flex: none; width: 12px; height: 12px; border-radius: 3px; background: var(--red-hi); }
  .cost-leg .k-mo { height: 5px; background: var(--green-hi); }
  .cost-leg .k-ext { height: 0; border-radius: 0; background: none; border-top: 1px dashed var(--accent); }
  .phases { display: grid; gap: 16px; }
  @media (min-width: 620px) { .phases { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .phase { display: grid; gap: 10px; align-content: start; padding: 20px; border: 1px solid var(--rule); border-radius: 14px; background: var(--card); }
  .phase-n { font: 300 34px/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
  .phase > p { font-size: 15.5px; }
  .phase .phase-l { padding-top: 6px; font: 500 14.5px/var(--lh-s) var(--display); color: var(--accent); }
  .phase .checks { padding: 0; gap: 7px; }
  .phase .checks li { font-size: 15px; }
  .split { padding: 14px 0 0; border-top: 1px solid var(--rule); font-size: 15.5px; color: var(--soft); }
  .box { display: grid; gap: 10px; padding: 18px 20px; border: 1px solid var(--accent); border-radius: 14px; }
  .box p { font-size: 15.5px; }
  .box .checks { padding: 0; }
  .box.lasting { border-color: var(--green-hi); background: var(--card); }

  /* Journey */
  .steps { display: grid; }
  .steps li { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 18px; padding-bottom: 26px; }
  .steps li::before { content: ""; position: absolute; inset-inline-start: 25.5px; top: 52px; bottom: 0; width: 1px; background: var(--blue); opacity: .5; }
  .steps li:last-child { padding-bottom: 0; }
  .steps li:last-child::before { display: none; }
  .step-n { display: grid; place-items: center; width: 52px; height: 52px; border: 1px solid var(--blue); border-radius: 50%; background: var(--blue); color: #FFFFFF; font: 500 18px/1 var(--display); font-variant-numeric: tabular-nums; }
  .steps li:last-child .step-n { border-color: var(--green); background: var(--green); }
  .steps h3 { padding-top: 11px; }
  :root[lang="ar"] .steps h3 { padding-top: 8px; }
  .steps p { padding-top: 4px; font-size: 16.5px; color: var(--soft); max-width: 36em; }

  /* Vision: the first AI employee at the centre, the team it can grow into around it */
  .vorbit { position: relative; width: min(100%, 520px); aspect-ratio: 1; margin: 0 auto; container-type: inline-size; }
  .vorbit > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vorbit .ring { fill: none; stroke: var(--sky); stroke-width: 1.2; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
  .vorbit .ring.in { stroke: var(--blue); opacity: .5; }
  .vorbit .spoke { stroke-width: 1.4; stroke-dasharray: 2 5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .v-core { position: absolute; left: 50%; top: 50%; display: grid; justify-items: center; gap: 1.4cqw; width: 34cqw; transform: translate(-50%, -38%); text-align: center; }
  .v-core img { width: 24cqw; height: 24cqw; border-radius: 50%; box-shadow: 0 0 0 1.2cqw rgba(156, 195, 234, .35), 0 1.6cqw 4cqw rgba(15, 28, 45, .35); }
  .v-core b { padding: 0 1.4cqw; border-radius: 8px; background: rgba(244, 248, 253, .9); font: 600 15px/1.3 var(--display); font-size: clamp(12px, 3.1cqw, 16px); color: var(--ink); text-wrap: balance; }
  .v-tag { position: absolute; padding: .5cqw 2.2cqw; border-radius: 999px; font-size: clamp(11px, 2.6cqw, 13.5px); font-weight: 600; line-height: 1.6; white-space: nowrap; transform: translate(-50%, -50%); }
  .v-tag.now { left: 50%; top: 31.5%; background: var(--red); color: #FFFFFF; }
  .v-tag.later { left: 50%; top: 12%; background: #FFFFFF; color: var(--green-ink); border: 1px solid var(--green); }
  .v-node { position: absolute; display: grid; justify-items: center; gap: 1cqw; width: 23cqw; transform: translate(-50%, -30%); text-align: center; }
  .v-node .mark { width: 11.5cqw; height: 11.5cqw; border-radius: 50%; box-shadow: 0 0 0 .9cqw #FFFFFF, 0 1.4cqw 3cqw rgba(20, 33, 58, .22); }
  .v-node .mark .ic { width: 5.2cqw; height: 5.2cqw; }
  .v-node span { padding: 0 .8cqw; border-radius: 6px; background: rgba(244, 248, 253, .85); font: 500 13.5px/1.3 var(--display); font-size: clamp(11px, 2.8cqw, 14.5px); color: var(--ink); text-wrap: balance; }
  .stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .vstage { position: relative; display: grid; gap: 6px; align-content: start; padding: 14px; border: 1px solid var(--rule); border-radius: 16px; background: var(--card); }
  .vstage svg { width: 62px; height: 62px; }
  .vstage b { font: 600 16px/1.3 var(--display); color: var(--stc); }
  .vstage p { font-size: 14px; line-height: 1.5; color: var(--soft); }
  :root[lang="ar"] .vstage p { line-height: 1.7; }
  .vstage:nth-child(1) { --stc: var(--red); }
  .vstage:nth-child(2) { --stc: var(--blue-ink); }
  .vstage:nth-child(3) { --stc: var(--green-ink); }
  .vstage:not(:last-child)::after { content: ""; position: absolute; top: 44px; inset-inline-end: -9px; z-index: 1; width: 8px; height: 8px; border-top: 2px solid var(--sky); border-inline-end: 2px solid var(--sky); transform: rotate(calc(45deg * var(--dirx))); }
  .decide { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: rgba(156, 195, 234, .18); font: 500 16px/1.45 var(--display); }
  .decide .ic { width: 22px; height: 22px; color: var(--red); }
  @media (max-width: 619px) {
    .stages { grid-template-columns: minmax(0, 1fr); }
    .vstage { grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: center; }
    .vstage svg { grid-row: span 2; width: 52px; height: 52px; }
    .vstage:not(:last-child)::after { display: none; }
  }

  /* Meet Hala */
  .meet-side { justify-items: center; text-align: center; gap: 8px; }
  .meet-photo { width: min(300px, 70%); aspect-ratio: 1; margin: 24px 0 26px; border-radius: 50%; object-fit: cover; border: 4px solid var(--red); box-shadow: 0 0 0 10px rgba(156, 195, 234, .45), 0 0 0 22px rgba(156, 195, 234, .22); }
  .meet-name { font: 600 clamp(26px, 2.6vw, 32px)/var(--lh-s) var(--display); letter-spacing: var(--caps); color: var(--red); }
  .meet-role { font-size: 15px; line-height: var(--lh-s); color: var(--blue-ink); }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 430px; padding-top: 12px; }
  .chips li { padding: 5px 13px; border: 1.5px solid var(--sky); border-radius: 999px; background: #FFFFFF; color: var(--blue-ink); font: 600 14px/1.5 var(--body); box-shadow: 0 5px 12px rgba(47, 111, 168, .12); }
  .chips-t { padding-top: 14px; font-size: 13.5px; line-height: var(--lh-s); color: var(--soft); }
  .ways { display: grid; gap: 16px; }
  @media (min-width: 620px) { .ways { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .ways li { display: grid; gap: 4px; align-content: start; padding-top: 14px; border-top: 2px solid var(--red); }
  .ways b { font: 500 18px/var(--lh-s) var(--display); }
  .ways span { font-size: 15.5px; color: var(--soft); }
  .vow { display: flex; align-items: center; gap: 12px; }
  .vow img { flex: none; width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--red); }
  .vow p { padding: 12px 18px; border-radius: 18px; border-end-start-radius: 4px; background: var(--sky-1); font: 500 18px/var(--lh-s) var(--display); }
  :root[lang="ar"] .vow p { font-size: 16.5px; }

  /* Let's talk: the email's signature and footer */
  .esig-wrap { display: flex; align-items: center; gap: 18px; }
  .esig-ava { flex: none; width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--red); }
  .esig { display: grid; gap: 2px; min-width: 0; padding-inline-start: 16px; border-inline-start: 3px solid var(--red); }
  .esig-name { font: 600 24px/var(--lh-s) var(--display); letter-spacing: var(--caps); color: var(--red); }
  .esig-role { padding-bottom: 4px; font-size: 15px; line-height: var(--lh-s); color: var(--blue-ink); }
  .esig a { justify-self: start; font-size: 15.5px; line-height: 1.65; text-underline-offset: 3px; overflow-wrap: anywhere; unicode-bidi: isolate; }
  .esig-mail { color: var(--red); }
  .esig-wa { color: #2F7D32; }
  .esig-ig { color: var(--blue-ink); }
  .esig-links { display: flex; flex-wrap: wrap; gap: 0 18px; }
  .band { flex: none; margin-top: auto; background: linear-gradient(135deg, var(--green-1) 0%, var(--green-2) 100%); }
  .band p { max-width: 1160px; margin: 0 auto; padding: 22px clamp(20px, 4vw, 48px) 4px; font: 400 clamp(18px, 2vw, 22px)/var(--lh-s) var(--display); color: #F2F6EE; text-wrap: balance; }
  .bridge { width: 100%; height: clamp(44px, 6vw, 78px); opacity: .5; pointer-events: none; }
  .bridge path { fill: none; stroke: #DDE8D8; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .bridge .hang { opacity: .45; }
  .bridge .deck { stroke-width: 1.5; }

  /* Reader's bar: notebook index tabs hanging from the page edge, one per chapter, coloured by section */
  .bot { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: "prev tabs toc next"; align-items: center; column-gap: 12px; min-height: 64px; padding: 0 20px; background: var(--sky-2); border-top: 1px solid var(--sky); }
  #prev { grid-area: prev; }
  #toc-btn { grid-area: toc; }
  #next { grid-area: next; }
  .nav-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 44px; height: 44px; padding: 0 16px; border: 1px solid var(--sky); border-radius: 12px; background: #FFFFFF; color: var(--blue-ink); font: 500 15px/1 var(--body); cursor: pointer; }
  .nav-btn .ic { width: 18px; height: 18px; }
  .nav-btn.primary { border: 0; background: linear-gradient(135deg, var(--red-hi), var(--red-lo)); color: #FFFFFF; font-weight: 600; box-shadow: 0 6px 14px rgba(142, 1, 7, .28); }
  .nav-btn.square { padding: 0; }
  .nav-btn:disabled { opacity: .32; cursor: default; box-shadow: none; }
  .tabs { grid-area: tabs; align-self: start; display: flex; align-items: flex-start; gap: 4px; min-width: 0; margin-top: -1px; padding: 0 14px 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { --tc: var(--muted); flex: none; display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 12px; border: 1px solid var(--sky); border-top: 0; border-bottom: 3px solid var(--tc); border-radius: 0 0 11px 11px; background: var(--sky-1); color: var(--muted); font: 500 13.5px/1 var(--body); white-space: nowrap; cursor: pointer; transition: height .18s ease, background-color .18s ease; }
  :root[lang="ar"] .tab { font-size: 14px; }
  .tab .ic { width: 16px; height: 16px; color: var(--tc); }
  .tab:hover { background: #FFFFFF; color: var(--ink); }
  .tab.seen { color: var(--ink); }
  .tab[aria-current="true"] { height: 52px; background: #FFFFFF; color: var(--ink); font-weight: 600; border-bottom-width: 4px; box-shadow: 0 10px 18px -8px rgba(20, 33, 58, .3); }
  .s0 { --tc: #6B7487; }
  .s1 { --tc: var(--red); }
  .s2 { --tc: var(--blue); }
  .s3 { --tc: var(--green); }
  .s4 { --tc: var(--ink); }
  .where { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .pop { position: absolute; z-index: 40; inset-inline-end: 20px; width: min(370px, calc(100vw - 24px)); max-height: min(70vh, 560px); overflow: auto; padding: 8px; border: 1px solid var(--sky); border-radius: 14px; background: #FFFFFF; color: var(--ink); box-shadow: 0 24px 60px -18px rgba(15, 28, 45, .55); }
  .pop[hidden] { display: none; }
  #sector-menu { top: calc(100% + 8px); }
  #toc { bottom: calc(100% + 8px); }
  .pop-t { padding: 8px 12px 6px; font: 500 14px/var(--lh-s) var(--display); color: var(--muted); }
  .pop-g { margin-top: 6px; padding: 9px 12px 3px; border-top: 1px solid var(--sky-1); font-size: 12.5px; line-height: var(--lh-s); color: var(--red); font-weight: 600; }
  .pop button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; background: none; color: inherit; font: 500 15.5px/var(--lh-s) var(--body); text-align: start; cursor: pointer; }
  .pop button:hover, .pop button[aria-current="true"] { background: var(--sky-2); }
  .pop .mark { width: 34px; height: 34px; border-radius: 10px; }
  .pop .mark .ic { width: 18px; height: 18px; }
  .pop .num { min-width: 22px; color: var(--tc, var(--blue-ink)); font-variant-numeric: tabular-nums; font-weight: 600; }
  noscript p { padding: 40px 24px; }

  @media (max-width: 760px) {
    .how { grid-template-columns: minmax(0, 1fr); }
    .how-arrow { justify-self: center; transform: rotate(90deg); }
    [dir="rtl"] .how-arrow .dir { transform: none; }
    .how-col ul { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 619px) {
    body { font-size: 16.5px; }
    .top { min-height: 58px; padding: 8px 14px; gap: 8px; }
    .brand { gap: 9px; }
    .brand img { width: 38px; height: 38px; }
    .brand b { font-size: 14.5px; letter-spacing: 0; }
    .brand-t span { display: none; }
    .chip > span { display: none; }
    .chip { padding: 0 9px 0 11px; gap: 5px; }
    .langs button { min-width: 34px; padding: 0 6px; }
    .bot { grid-template-areas: "tabs tabs tabs tabs" "prev where toc next"; column-gap: 8px; row-gap: 6px; min-height: 0; padding: 0 12px 8px; }
    .tabs { margin-inline: -12px; padding: 0 12px 2px; }
    .tab { height: 36px; padding: 0 10px; font-size: 12.5px; gap: 6px; }
    .tab[aria-current="true"] { height: 42px; }
    .where { position: static; grid-area: where; width: auto; height: auto; overflow: hidden; clip-path: none; text-overflow: ellipsis; font-size: 13px; line-height: 1.4; color: var(--muted); }
    .where b { margin-inline-end: 8px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    .nav-btn.prev span { display: none; }
    .nav-btn.prev { padding: 0; }
    .pop { inset-inline-end: 12px; }
    .acc-body { padding-inline-end: 0; }
    .node { width: 92px; }
    .seg button { padding: 8px 6px; font-size: 14.5px; }
    .door .who { display: none; }
    .esig-wrap { gap: 14px; }
    .esig-ava { width: 76px; height: 76px; }
    .vow img { width: 52px; height: 52px; }
    .fab { bottom: 14px; inset-inline-start: 14px; height: 50px; padding: 0 17px 0 14px; font-size: 15px; }
    .pairs-h { display: none; }
    .pair { grid-template-columns: minmax(0, 1fr); gap: 5px; }
    .lanes { padding: 14px; }
    .lane li { font-size: 12.5px; padding-inline-end: 5px; }
    .opt { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 16px; }
    .tl { width: 100%; }
    .org .o-dept { font-size: 20px; }
    .org .o-x { font-size: 19px; }
    .org .o-name { font-size: 21px; }
    .org .o-line { font-size: 26px; }
    .org .o-you { font-size: 28px; }
    :root[lang="ar"] .org .o-dept, :root[lang="ar"] .org .o-x { font-size: 18px; }
    :root[lang="ar"] .org .o-you { font-size: 24px; }
    .pills { grid-template-columns: minmax(0, 1fr); }
    .pills li { min-height: 0; padding: 9px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .in-fwd .sheet, .in-back .sheet, .chat.play .msg, .chat.play .tl, .chat.play .tl li, .chat.play .sent, .fab::before { animation: none; }
    .door, .pm::after, .node, .wire, .onward, .btn, .tab { transition: none; }
  }
</style>

<div class="app">
  <header class="top">
    <span class="brand" id="brand"><img src="assets/hala-s.jpg" width="320" height="320" alt=""><span class="brand-t"><b></b><span></span></span></span>
    <button type="button" class="chip" id="sector-btn" aria-haspopup="true" aria-expanded="false" data-menu="sector"></button>
    <div class="langs" role="group" id="langs">
      <button type="button" data-lang="tr" lang="tr" aria-label="Türkçe">TR</button>
      <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
      <button type="button" data-lang="ar" lang="ar" aria-label="العربية">عربي</button>
    </div>
    <div class="pop" id="sector-menu" hidden></div>
  </header>

  <main class="stage" id="stage">

    if (ev.target.closest && ev.target.closest('input,textarea,select,[role="tablist"],.pop')) return;
    if (ev.key === 'ArrowRight') { ev.preventDefault(); go(state.page + fwd()); }
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); go(state.page - fwd()); }
  });

  var swipe = null;
  stage.addEventListener('touchstart', function (ev) {
    var p = ev.changedTouches[0];
    swipe = { x: p.clientX, y: p.clientY, at: Date.now() };
  }, { passive: true });
  stage.addEventListener('touchend', function (ev) {
    if (!swipe) return;
    var p = ev.changedTouches[0], dx = p.clientX - swipe.x, dy = p.clientY - swipe.y, quick = Date.now() - swipe.at < 600;
    swipe = null;
    if (quick && Math.abs(dx) > 70 && Math.abs(dy) < 45) go(state.page + (dx < 0 ? 1 : -1) * fwd(), false);
  }, { passive: true });

  /* ------------------------------ Start ------------------------------ */
  function readHash() {
    var h = (location.hash || '').replace('#', '').toLowerCase();
    var lang = h.slice(0, 2);
    if (LANGS.indexOf(lang) < 0) return null;
    var rest = h.slice(3), sector = null;
    if (rest) ['tr', 'en'].forEach(function (l) { SECTORS.forEach(function (k) { if (SLUG[l][k] === rest) sector = k; }); });
    return { lang: lang, sector: sector };
  }
  var fromHash = readHash();
  if (fromHash) {
    state.lang = fromHash.lang;
    state.sector = fromHash.sector;
  } else {
    try { var saved = localStorage.getItem('booklet-lang'); if (LANGS.indexOf(saved) >= 0) state.lang = saved; } catch (e) { /* storage may be unavailable */ }
  }
  window.addEventListener('hashchange', function () {
    var next = readHash();
    if (!next || (next.lang === state.lang && next.sector === state.sector)) return;
    state.lang = next.lang;
    state.sector = next.sector;
    update(0);
  });

  window.booklet = { go: go, pick: pickSector, lang: setLang, tab: function (id) { state.model = id; update(0, true); } };
  update(0);
})();
</script>
</body>
</html>
